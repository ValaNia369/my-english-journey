<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1522"><meta name="description" content="Private English learning library, Sol imports and spaced repetition."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><title>My English Journey</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#15283a;background:#f5f7fa;--navy:#14283c;--a:#2d7789;--line:#e0e6eb;--muted:#687783}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:1140px;margin:auto;min-height:100dvh}.top{background:var(--navy);color:white;padding:21px 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{font-size:19px;margin:0}.top small{color:#bbd0db}.nav{display:flex;overflow-x:auto;gap:5px;background:white;padding:8px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;border:0;background:transparent;padding:11px 13px;border-radius:10px;color:#516475;font-size:13px}.nav button.active{background:#e4f2f4;color:#155366;font-weight:700}main{padding:17px 14px 100px;max-width:960px;margin:auto}h2{font-size:23px;margin:8px 0 15px}h3{font-size:16px;margin:12px 0}.muted{color:var(--muted)}.small{font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 3px 12px #19324807}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:white;padding:16px;border-radius:14px;border:1px solid var(--line)}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}.btn{border:1px solid #c7d6dc;border-radius:11px;padding:11px 14px;background:#fff;color:#213d50;font-weight:600}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn.soft{background:#eaf2f4}.btn.danger{color:#ae3434}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:block;margin:12px 0}.field>span{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field input,.field textarea,.field select,.search{display:block;width:100%;border:1px solid #cbd5dd;border-radius:10px;padding:11px;background:white;color:#1e3444}.field textarea{min-height:85px;resize:vertical}.search{margin-bottom:14px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-title{font-weight:650;overflow-wrap:anywhere}.pill{display:inline-block;font-size:11px;background:#eaf0f4;padding:4px 8px;border-radius:99px;margin:3px 4px 3px 0}.card{min-height:184px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:18px;border-radius:15px;background:#edf2f5;gap:14px}.card strong{font-size:clamp(20px,4.8vw,30px);line-height:1.36;overflow-wrap:anywhere}.flip{border:0;background:none;font-size:26px;color:#386b82;line-height:1;padding:10px 18px}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.rating button{font-size:12px;padding:12px 3px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}.toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);background:#163448;color:white;padding:11px 18px;border-radius:12px;z-index:9;max-width:90%;box-shadow:0 4px 25px #0004}.hidden{display:none!important}.word{font-size:24px;font-weight:750}.accented{padding:1px 5px;border-radius:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.mini{font-size:12px;padding:6px 10px}.empty{padding:25px;text-align:center;color:var(--muted)}.media{max-width:100%;max-height:230px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.review-note{font-size:12px;text-align:center;color:var(--muted)}.full{width:100%}.progress{height:6px;background:#e6edef;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#4d9b9e}code{overflow-wrap:anywhere}@media(min-width:750px){.stats{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(3,1fr)}main{padding:25px}.top{padding:23px 28px}.nav{justify-content:center}}

/* v1.1: permanent dark theme, comfortable contrast on mobile */
:root{color-scheme:dark;--navy:#17283d;--a:#70bdc8;--line:#334658;--muted:#a8bac9;color:#e9f0f7;background:#0c1522}
html,body{background:#0c1522;color:#e9f0f7}
.top{background:#142438;color:#f0f6fc}.top small{color:#bed0e1}
.nav{background:#142237;border-color:var(--line)}.nav button{color:#bfceda}.nav button.active{background:#264452;color:#e3fbff}
.panel,.stat{background:#18283b;border-color:#32465b;color:#edf4fc;box-shadow:0 4px 18px #0002}
.stat-link{width:100%;text-align:left;cursor:pointer;font:inherit;transition:border-color .15s,background .15s}

.stat-link:active,.item-link:active{background:#29475c}
.stat span{color:#a8bac9}
.btn{background:#22374a;color:#eaf3ff;border-color:#456074}.btn.primary{background:#366c80;color:#fff;border-color:#4c8799}.btn.soft{background:#294755;color:#f0fbff}.btn.danger{color:#ffb5b5}
.field input,.field textarea,.field select,.search{background:#101e2d;border-color:#496174;color:#f4f8ff}

.card{background:#22374a;color:#f8fbff}.flip{color:#9adddf}
.pill{background:#2b4256;color:#e0eef9}.toast{background:#38617a;color:white}
.progress{background:#344758}.progress>div{background:#78bfbd}
.item-link{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;margin-bottom:9px}

.item-link .item-title{line-height:1.5}.accented{color:#1c2b36}
:focus-visible{outline:2px solid #9cdeeb;outline-offset:2px}
</style></head><body><div class="shell"><header class="top"><div><h1>My English Journey</h1><small>Learn naturally. Remember longer.</small></div><button id="install" class="btn mini hidden">Install</button></header><nav class="nav" id="nav"></nav><main id="app"></main></div><div id="toast" class="toast hidden" role="status"></div><script src="app.js" defer></script></body></html>
